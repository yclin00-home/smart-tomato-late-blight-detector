name: Keep Render Alive (California Daytime)

on:
  schedule:
    # 加州時間 06:00 到 22:00（對應 UTC 時間 14:00 到 06:00）
    # 每 13 分鐘執行一次
    - cron: '*/13 14-6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render
        run: |
          curl -I https://smart-tomato-late-blight-detector.onrender.com/
