name: Keep Render Alive

on:
  schedule:
    # 每 13 分鐘自動執行一次，防止 Render 進入 15 分鐘休眠
    - cron: '*/13 * * * *'
  workflow_dispatch: # 允許您在網頁手動點擊按鈕測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render
        run: |
          curl -I https://smart-tomato-late-blight-detector.onrender.com/
