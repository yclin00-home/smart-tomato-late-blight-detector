name: Keep Render Alive 24/7

on:
  schedule:
    # 24小時不間斷，每 13 分鐘執行一次
    - cron: '*/13 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Render
        run: |
          curl -I "https://smart-tomato-late-blight-detector.onrender.com/"
